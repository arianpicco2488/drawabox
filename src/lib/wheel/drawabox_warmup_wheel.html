
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; }

  .page { font-family: var(--font-sans); padding: 2rem 1.5rem; max-width: 680px; }

  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.25rem; }
  .back-btn { background: none; border: none; cursor: pointer; color: #e49944; font-size: 20px; padding: 4px; display: flex; align-items: center; }
  .page-title { font-size: 20px; font-weight: 500; color: var(--color-text-primary); }
  .page-title span { color: #e49944; }
  .dark-btn { background: none; border: none; cursor: pointer; color: var(--color-text-secondary); font-size: 18px; display: flex; align-items: center; }

  .subtitle { text-align: center; font-size: 13px; color: var(--color-text-secondary); margin-bottom: 1.5rem; }

  .divider { border: none; border-top: 0.5px solid var(--color-border-tertiary); margin-bottom: 1.75rem; }

  .content { display: flex; align-items: center; gap: 2rem; flex-wrap: wrap; justify-content: center; }

  .wheel-wrap { position: relative; width: 300px; height: 300px; flex-shrink: 0; }

  .pointer {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 20px solid #e49944;
    z-index: 10;
    filter: drop-shadow(0 2px 4px rgba(228,153,68,0.5));
  }

  #wheelCanvas {
    width: 300px; height: 300px;
    border-radius: 50%;
    display: block;
  }

  .right-panel { display: flex; flex-direction: column; gap: 1rem; min-width: 180px; }

  .pill {
    display: flex; align-items: center; gap: 8px;
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    color: var(--color-text-primary);
    white-space: nowrap;
  }
  .pill-dot { width: 8px; height: 8px; border-radius: 50%; background: #e49944; flex-shrink: 0; }

  .result-card {
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    padding: 1rem;
    min-height: 80px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .result-label { font-size: 11px; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .result-exercise { font-size: 15px; font-weight: 500; color: var(--color-text-primary); line-height: 1.3; }
  .result-placeholder { font-size: 13px; color: var(--color-text-secondary); font-style: italic; }

  .spin-btn {
    background: #e49944;
    color: #1a0e00;
    border: none;
    border-radius: 999px;
    padding: 12px 28px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    width: 100%;
  }
  .spin-btn:hover { background: #f0b060; }
  .spin-btn:active { transform: scale(0.97); }
  .spin-btn:disabled { background: #b07030; cursor: not-allowed; }
</style>

<div class="page">
  <div class="top-bar">
    <button class="back-btn" aria-label="Go back"><i class="ti ti-arrow-left"></i></button>
    <div class="page-title">Warm-up <span>Selector</span></div>
    <button class="dark-btn" aria-label="Toggle dark mode"><i class="ti ti-moon"></i></button>
  </div>
  <p class="subtitle">Spin for a random exercise from your completed lessons</p>
  <hr class="divider">

  <div class="content">
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <canvas id="wheelCanvas" width="600" height="600"></canvas>
    </div>

    <div class="right-panel">
      <div class="pill">
        <span class="pill-dot"></span>
        <span id="exerciseCount">23 exercises from 5 lessons</span>
      </div>

      <div class="result-card">
        <div class="result-label">Selected exercise</div>
        <div id="resultText" class="result-placeholder">Spin the wheel to find out…</div>
      </div>

      <button class="spin-btn" id="spinBtn" onclick="spinWheel()">Spin the wheel</button>
    </div>
  </div>
</div>

<script>
const exercises = [
  "Superimposed Lines","Ghosted Lines","Ghosted Planes",
  "Tables of Ellipses","Ellipses in Planes","Funnels",
  "Organic Arrows","Contour Lines","Organic Forms with Contour Curves",
  "Organic Forms with Contour Ellipses","Form Intersections","Organic Intersections",
  "Dissections","Texture Analysis","Future Analysis",
  "Leaves","Branches","Plant Drawings",
  "Insect Drawings","Arachnid Drawings","Birds",
  "Non-Hooved Quadrupeds","Hooved Quadrupeds"
];

const AMBER = "#e49944";
const AMBER_DARK = "#c47c20";
const SEGMENT_COLORS = ["#1e1e1e","#252525","#2a2a2a","#1a1a1a"];

const canvas = document.getElementById("wheelCanvas");
const ctx = canvas.getContext("2d");
const W = 600, CX = 300, CY = 300, R = 270, INNER = 68;
let currentAngle = 0;
let spinning = false;

function drawWheel(rotation) {
  ctx.clearRect(0,0,W,W);
  const n = exercises.length;
  const arc = (2 * Math.PI) / n;

  for (let i = 0; i < n; i++) {
    const start = rotation + i * arc;
    const end = start + arc;
    const mid = start + arc / 2;

    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R, start, end);
    ctx.closePath();
    ctx.fillStyle = SEGMENT_COLORS[i % SEGMENT_COLORS.length];
    ctx.fill();
    ctx.strokeStyle = "#333";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(mid);
    ctx.textAlign = "right";
    ctx.font = "500 18px var(--font-sans, sans-serif)";
    ctx.fillStyle = i % 2 === 0 ? "#e8e8e8" : AMBER;
    ctx.fillText(exercises[i], R - 14, 6);
    ctx.restore();
  }

  const grad = ctx.createRadialGradient(CX, CY, INNER - 2, CX, CY, INNER + 4);
  grad.addColorStop(0, AMBER_DARK);
  grad.addColorStop(1, AMBER);
  ctx.beginPath();
  ctx.arc(CX, CY, INNER, 0, 2 * Math.PI);
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, 2 * Math.PI);
  ctx.strokeStyle = AMBER;
  ctx.lineWidth = 5;
  ctx.stroke();

  ctx.save();
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "500 17px var(--font-sans, sans-serif)";
  ctx.fillStyle = "#1a0e00";
  ctx.fillText("WARM", CX, CY - 10);
  ctx.fillText("UP", CX, CY + 10);
  ctx.restore();
}

function getSelected(rotation) {
  const n = exercises.length;
  const arc = (2 * Math.PI) / n;
  const normalised = ((-rotation) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI);
  const pointerAngle = Math.PI / 2;
  const adjusted = (normalised + pointerAngle) % (2 * Math.PI);
  const idx = Math.floor(adjusted / arc) % n;
  return exercises[idx];
}

function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

function spinWheel() {
  if (spinning) return;
  spinning = true;
  document.getElementById("spinBtn").disabled = true;
  document.getElementById("resultText").className = "result-placeholder";
  document.getElementById("resultText").textContent = "Spinning…";

  const extraSpins = (5 + Math.random() * 5) * 2 * Math.PI;
  const targetDelta = extraSpins + Math.random() * 2 * Math.PI;
  const startAngle = currentAngle;
  const duration = 3000 + Math.random() * 1000;
  const start = performance.now();

  function frame(now) {
    const elapsed = now - start;
    const t = Math.min(elapsed / duration, 1);
    const eased = easeOut(t);
    currentAngle = startAngle + targetDelta * eased;
    drawWheel(currentAngle);

    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      spinning = false;
      document.getElementById("spinBtn").disabled = false;
      const selected = getSelected(currentAngle);
      const el = document.getElementById("resultText");
      el.className = "result-exercise";
      el.textContent = selected;
    }
  }

  requestAnimationFrame(frame);
}

drawWheel(0);
</script>
